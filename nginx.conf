events{}

http{
    include /etc/nginx/mime.types;
    
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html/nginx;
        index index.html;
        error_page 404 /404.html;
    
        location / {
            try_files $uri $uri.html $uri/ =404;
        }
    }
}